<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number bypass Otp Verification by, Nahid</title>
    <!-- Tailwind CSS CDN -->
  <link rel="apple-touch-icon" href="https://uploads.onecompiler.io/44erjyhyq/44fv4f9v4/1000213404.png">
     <meta name="keywords" content="Phone bypass, Number otp, phone bypass, ">
   
 <meta name="author" content="Free Number bypass ">
  <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Hind Siliguri for Bengali text) -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
        }
        .otp-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
            outline: none;
        }
        /* Modal animation */
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: modalPop 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Card Container -->
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 sm:p-8 border border-gray-100">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
          <i class="fa-solid fa-spinner fa-spin" style="color: rgb(255, 0, 2);"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Account Verification</h1>
            <p class="text-gray-500 text-sm mt-1">Verify Your Mobile Number</p>
        </div>

        <!-- Verification Form -->
        <form id="verificationForm" onsubmit="event.preventDefault();">
            
            <!-- Operator Selection -->
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-1">Select Operator</label>
                <div class="relative">
                    <select id="operator" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none">
                        <option value="+88017">+88017 (Grameenphone)</option>
                        <option value="+88018">+88018 (Robi)</option>
                        <option value="+88019">+88019 (Banglalink)</option>
                        <option value="+88016">+88016 (Airtel)</option>
                        <option value="+88015">+88015 (Teletalk)</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- Phone Input Field -->
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-1">Mobile Number</label>
                <input type="tel" id="phone" placeholder="017XXXXXXXX" maxlength="11" 
                    class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
            </div>

            <!-- Send OTP Button -->
            <button type="button" id="sendOtpBtn" onclick="handleSendOTP()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 mb-6 shadow-md shadow-blue-200">
                Send OTP
            </button>

            <!-- OTP Input Section (Disabled initially) -->
            <div id="otpSection" class="opacity-50 pointer-events-none transition-opacity duration-300">
                <label class="block text-sm font-semibold text-gray-700 mb-2 text-center">Enter the 4-digit  Otp Code</label>
                <div class="flex justify-center gap-3 mb-6">
                    <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold bg-gray-50 border border-gray-300 rounded-lg" data-index="0">
                    <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold bg-gray-50 border border-gray-300 rounded-lg" data-index="1">
                    <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold bg-gray-50 border border-gray-300 rounded-lg" data-index="2">
                    <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-xl font-bold bg-gray-50 border border-gray-300 rounded-lg" data-index="3">
                </div>
            </div>

        </form>
    </div>

    <!-- Success Popup Modal -->
    <div id="successModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center animate-pop shadow-2xl">
            <div class="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">Successful</h3>
            <p class="text-gray-600 mb-6">The Account has been Completely Bypassed.</p>
            <button onclick="closeModal()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition duration-200">
                ঠিক আছে
            </button>
        </div>
    </div>

    <script>
        const otpInputs = document.querySelectorAll('.otp-input');
        const otpSection = document.getElementById('otpSection');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const successModal = document.getElementById('successModal');

        function handleSendOTP() {
            const phoneVal = document.getElementById('phone').value.trim();
            if(!phoneVal) {
                alert('অনুগ্রহ করে মোবাইল নম্বর লিখুন।');
                return;
            }
            
            // Enable OTP input section
            otpSection.classList.remove('opacity-50', 'pointer-events-none');
            sendOtpBtn.innerText = 'Resend OTP';
            otpInputs[0].focus();
        }

        // OTP Input Auto-focus & Modal trigger logic
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value;
                if (!/^[0-9]$/.test(val)) {
                    e.target.value = '';
                    return;
                }
                if (val && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
                checkOtpComplete();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        function checkOtpComplete() {
            const code = Array.from(otpInputs).map(i => i.value).join('');
            if (code.length === 4) {
                // Trigger Popup Modal
                setTimeout(() => {
                    successModal.classList.remove('hidden');
                }, 200);
            }
        }

        function closeModal() {
            successModal.classList.add('hidden');
            // Reset fields
            otpInputs.forEach(input => input.value = '');
            document.getElementById('phone').value = '';
            otpSection.classList.add('opacity-50', 'pointer-events-none');
            sendOtpBtn.innerText = 'Send OTP';
        }
    </script>
</body>
</html>
